openapi: 3.1.0
info:
  title: Zeam API Gateway
  version: 0.1.0
  description: |
    The Zeam API Gateway is the single entry point for all client traffic into
    the Zeam platform. It terminates authentication (SEP-10 app principals,
    OTP user principals, Firebase end-users, Azure Entra admins) and proxies
    to downstream services (`anchor.zeam.money`, `auth.zeam.dotnet`,
    `businessapi.zeam.go`, `association-applications.zeam.go`, Stellar Horizon).

    This spec is the **source of truth** for the endpoint reference. Every PR
    that changes a route under `/internal/transport/http/**` must update this
    file in the same change. See `docs/mintlify/AGENTS.md` for the contribution
    rules.
  contact:
    name: Zeam developers
    url: https://github.com/BeamMoney/zeam-api-gateway.go
    email: developers@zeam.app
  license:
    name: Proprietary
servers:
  - url: https://api-gateway.zeam.app
    description: Zeam API Gateway
  - url: http://localhost:8080
    description: Local
tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Public auth
    description: Unauthenticated endpoints that issue credentials.
  - name: Business
    description: Proxied Business API — associations, assets, wallets, beneficiaries.
  - name: Applications
    description: Registration, lifecycle, credentials and webhooks for third-party association applications.
  - name: Transactions
    description: |
      Transaction initialisation, status, and load. Proxied to
      `transactions-v2.zeam.dotnet` and `transactions-acl.zeam.dotnet`.
      Firebase authenticated.
  - name: Connect
    description: |
      Cross-border payments and ramps. Proxied to `connect.zeam.dotnet`.
      Requires both a SEP-10 bearer (`Authorization`) and an app credential
      (`x-zeam-auth`), except `/v1/connect-query` which also accepts
      Firebase bearers without `x-zeam-auth`.
  - name: Stellar
    description: |
      Read-only Stellar Horizon lookups — account details, account
      transactions, transaction details, and transaction effects.
      Firebase authenticated. No credentials are forwarded to Horizon.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Gateway liveness
      description: |
        Returns the gateway's liveness state, uptime in milliseconds, and — if
        a database is wired — the database ping result. Unauthenticated.
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Gateway is live.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeHealth"
              examples:
                ok:
                  summary: Healthy response
                  value:
                    ok: true
                    request_id: "req_01HWX9YZ7T5K8QF3NSDE9B2M0P"
                    resource: health
                    verb: get
                    data:
                      status: ready
                      uptime_ms: 874211
                      version: "5b1f3ac"
                      db: "ok"

  /v1/public/auth/request-otp:
    post:
      tags: [Public auth]
      summary: Start OTP login
      description: |
        Begins an OTP login flow for a user, member, or third-party user. The
        gateway proxies to the Zeam Auth Service (`auth.zeam.dotnet`) which
        dispatches the OTP (WhatsApp by default). Unauthenticated — this
        endpoint issues the credential that protects every `/v1/*` route.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpInput"
      responses:
        "200":
          description: OTP dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOtpResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/auth/verify-otp:
    post:
      tags: [Public auth]
      summary: Verify OTP and issue tokens
      description: |
        Exchanges a one-time code for an `idToken` / `refreshToken`. The gateway
        captures the `idToken` in its in-memory `AnchorStore` so the single
        `ValidateBearer` middleware can protect `/v1/*` routes regardless of
        which backend issued the token.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpInput"
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/public/auth/refresh:
    post:
      tags: [Public auth]
      summary: Refresh an access token
      description: |
        Exchanges a `refreshToken` for a new `idToken`. Proxied to
        `auth.zeam.app /api/v1/Authentication/refresh-token` regardless of
        whether the original token was issued via OTP or SEP-10.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: Long-lived refresh token previously issued by the gateway.
      responses:
        "200":
          description: Fresh token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/public/auth/sign-up:
    post:
      tags: [Public auth]
      summary: Start OTP sign-up
      description: |
        Begins an OTP sign-up flow for a new user. Proxied to
        `auth.zeam.dotnet /api/v1/Authentication/sign-up`, which creates a
        provisional user record and dispatches an OTP. The response carries
        an opaque `requestId` that must be echoed back to
        `/v1/public/auth/sign-up/verify`.
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpInput"
      responses:
        "200":
          description: OTP dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOtpResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/public/auth/sign-up/verify:
    post:
      tags: [Public auth]
      summary: Verify OTP and complete sign-up
      description: |
        Exchanges the sign-up OTP for a Firebase `idToken` / `refreshToken`.
        Proxied to
        `auth.zeam.dotnet /api/v1/Authentication/sign-up/verification`. The
        returned `idToken` is required by `POST /v1/users` to persist the
        user's metadata record (`Users.Metadata`).
      operationId: signUpVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpInput"
      responses:
        "200":
          description: Tokens issued; sign-up complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/public/auth/resend-otp:
    post:
      tags: [Public auth]
      summary: Resend OTP
      description: |
        Re-dispatches the OTP for an existing `requestId`. Used by both the
        sign-in and sign-up flows. Proxied to
        `auth.zeam.dotnet /api/v1/Otp/resend`.
      operationId: resendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId:
                  type: string
                  description: The opaque request identifier returned by sign-in or sign-up.
      responses:
        "200":
          description: OTP re-dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                  status:
                    type: integer
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Unauthorized"

  /v1/users:
    post:
      tags: [Public auth]
      summary: Create user (signup metadata)
      description: |
        Persists the `Users.Metadata` record for a newly OTP-verified user.
        The Firebase `idToken` issued by `/v1/public/auth/sign-up/verify` is
        forwarded verbatim in the `Authorization` header so
        `userapi.zeam.dotnet` can derive the `idpUid` from its own Firebase
        middleware. Proxied to `userapi.zeam.dotnet /api/v1/Users/CreateUser`.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Forwarded verbatim to userapi. Typical fields include
                `firstName`, `lastName`, `phoneNumber`, and `email`. Refer to
                `User.Zeam.Application.Commands.User.CreateUserCommand` for
                the full schema.
      responses:
        "200":
          description: User metadata persisted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me:
    get:
      tags: [Public auth]
      summary: Get user profile
      description: |
        Returns the authenticated user's profile (`IUserProfile`). Firebase
        authenticated. Proxied to
        `userapi.zeam.dotnet /api/v1/Users/GetUserBasic`.
      operationId: getMe
      responses:
        "200":
          description: User profile.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/assets:
    get:
      tags: [Public auth]
      summary: Get user asset balances
      description: |
        Returns the authenticated user's asset balances (`IUserAssets`).
        Firebase authenticated. Proxied to
        `userapi.zeam.dotnet /api/v1/UserAccounts/GetAssets`.
      operationId: getMyAssets
      responses:
        "200":
          description: Asset balances.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/transactions:
    get:
      tags: [Public auth]
      summary: List user transaction history
      description: |
        Returns paginated transaction history for the authenticated user
        (`IPaginatedTransactions`). Supports cursor pagination via the
        `cursor`, `publicKey`, and `assetCode` query parameters.
        Firebase authenticated. Proxied to
        `userapi.zeam.dotnet /api/v1/UserTransactions/transactionHistoryPaginated`.
      operationId: getMyTransactions
      parameters:
        - name: publicKey
          in: query
          schema:
            type: string
        - name: assetCode
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
          description: Paging token.
      responses:
        "200":
          description: Paginated transaction list.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/pin/validate:
    post:
      tags: [Public auth]
      summary: Validate user PIN
      description: |
        Validates a user's PIN by phone number. Firebase authenticated.
        Proxied to `userapi.zeam.dotnet /api/v1/Users/ValidatePin`.
      operationId: validatePin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, pin]
              properties:
                phoneNumber:
                  type: string
                  description: E.164 phone number.
                pin:
                  type: string
                  description: PIN to validate.
      responses:
        "200":
          description: PIN validation result.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/public/auth-connect:
    get:
      tags: [Public auth]
      summary: SEP-10 challenge (app principal)
      description: |
        Fetches a Stellar SEP-10 challenge XDR for the given app public key.
        The gateway proxies `GET /auth-connect?account=<G...>` to the Zeam
        anchor. The caller signs the returned challenge with their Stellar
        seed and submits it to `POST /v1/public/auth-connect`.
      operationId: sep10Challenge
      security: []
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
            pattern: "^G[A-Z0-9]{55}$"
          description: Stellar public key (56 characters, starts with `G`).
          example: GA5ZSE...EXAMPLE
      responses:
        "200":
          description: SEP-10 challenge envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    type: string
                    description: Base64 Stellar transaction XDR.
                  network_passphrase:
                    type: string
                    example: Public Global Stellar Network ; September 2015
    post:
      tags: [Public auth]
      summary: Submit signed SEP-10 challenge
      description: |
        Submits the signed challenge XDR and receives `{idToken, refreshToken,
        expiresIn}`. The gateway captures the `idToken` in its `AnchorStore`
        for subsequent `/v1/*` calls.
      operationId: sep10Submit
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction]
              properties:
                transaction:
                  type: string
                  description: Base64 Stellar transaction XDR, signed by the app Stellar seed.
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /v1/public/auth-connect/sign-in:
    post:
      tags: [Public auth]
      summary: Server-side SEP-10 round trip (convenience)
      description: |
        Collapses challenge + sign + submit into a single server-side call for
        clients that cannot sign locally. The Stellar seed is held on the
        server stack only for the duration of the request. Prefer the two-step
        challenge/submit flow whenever the caller can sign client-side — see
        ADR 0010 for the security posture.
      operationId: sep10SignIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey, secret]
              properties:
                publicKey:
                  type: string
                  pattern: "^G[A-Z0-9]{55}$"
                secret:
                  type: string
                  description: Stellar seed (`S...`). Held on stack only; never logged.
                  writeOnly: true
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /v1/business/association/all:
    get:
      tags: [Business]
      summary: List all associations
      description: |
        Proxies to the Business API (`businessapi.zeam.go`) `GET /api/v1/associations/all`.
        Requires a Firebase bearer token. Response filtered by the caller's `firebase_uid`.
      operationId: listAssociations
      responses:
        "200":
          description: List of associations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/association/{id}:
    get:
      tags: [Business]
      summary: Get association by ID
      description: |
        Proxies to `GET /api/v1/associations/:id` on the Business API.
      operationId: getAssociationById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Single association.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Association"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Asset ──────────────────────────────────────────────────────────────

  /v1/business/asset:
    get:
      tags: [Business]
      summary: List all assets
      description: |
        Returns all assets enriched with bridge data.
        Proxies to `GET /api/v1/asset/assets`.
      operationId: listAssets
      responses:
        "200":
          description: Asset list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/asset/dto:
    get:
      tags: [Business]
      summary: List asset DTOs
      description: |
        Returns minimal `AssetDTO` records for assets that have at least one
        active instance. Prefer this over the full asset list when you only
        need symbol / contract / issuer.
      operationId: listAssetDTOs
      responses:
        "200":
          description: Asset DTO list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/asset/dto/{id}:
    get:
      tags: [Business]
      summary: Get asset DTO by ID
      operationId: getAssetDtoById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Single asset DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/business/asset/{id}:
    get:
      tags: [Business]
      summary: Get asset by ID
      operationId: getAssetById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Full asset record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Wallet ─────────────────────────────────────────────────────────────

  /v1/business/wallet:
    post:
      tags: [Business]
      summary: Create a wallet
      description: |
        Proxies to `POST /api/v1/wallet/wallets` on the Business API.
      operationId: createWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Wallet creation payload (forwarded verbatim to upstream).
      responses:
        "200":
          description: Wallet created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/wallet/type:
    get:
      tags: [Business]
      summary: List wallet types
      operationId: listWalletTypes
      responses:
        "200":
          description: All wallet types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/wallet/all:
    get:
      tags: [Business]
      summary: List all wallets
      operationId: listAllWallets
      responses:
        "200":
          description: All wallets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/wallet/dto/{id}:
    get:
      tags: [Business]
      summary: Get wallet DTO by ID
      operationId: getWalletDtoById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Single wallet DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/business/wallet/association/{id}:
    get:
      tags: [Business]
      summary: List wallets by association
      description: |
        Returns wallets belonging to the specified association.
      operationId: listWalletsByAssociation
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Wallets for the association.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/wallet/{id}:
    get:
      tags: [Business]
      summary: Get wallet by ID
      operationId: getWalletById
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Single wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Business]
      summary: Update wallet
      operationId: updateWallet
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Wallet update payload (forwarded verbatim to upstream).
      responses:
        "200":
          description: Wallet updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/business/wallet/{id}/transaction:
    post:
      tags: [Business]
      summary: Execute Stellar transaction
      description: |
        Validates inputs, resolves the transaction type (Payment vs Strict
        Path Receive) from the supplied asset pair, and proxies to the
        Business API which signs via Bridge1 and submits to Horizon.
      operationId: executeStellarTransaction
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StellarTxRequest"
      responses:
        "200":
          description: Transaction submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/stellar/quote:
    post:
      tags: [Business]
      summary: Stellar path-payment quote
      description: |
        Proxies a path-payment quote request to the Business API. Both
        `fromAsset` and `toAsset` are required and must differ.
      operationId: stellarQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StellarQuoteRequest"
      responses:
        "200":
          description: Quote returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Beneficiaries ──────────────────────────────────────────────────────

  /v1/business/beneficiaries/{associationId}:
    get:
      tags: [Business]
      summary: List beneficiaries
      description: |
        Proxies to the Business API. Supports `search`, `beneficiary_type`,
        and `payment_method` query filters.
      operationId: listBeneficiaries
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring match on reference.
        - name: beneficiary_type
          in: query
          schema:
            type: string
            enum: [Individual, Business]
        - name: payment_method
          in: query
          schema:
            type: string
            enum: [BANK, MOMO, CRYPTO, CARD, CASH, QR, VOUCHER, WALLET]
      responses:
        "200":
          description: Beneficiary list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Business]
      summary: Create beneficiary
      description: |
        Body forwarded verbatim. Minimum required: `beneficiary_type` plus
        `first_name`/`last_name` (Individual) or `company_name` (Business).
      operationId: createBeneficiary
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Beneficiary payload (forwarded verbatim to upstream).
      responses:
        "200":
          description: Beneficiary created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/beneficiaries/{associationId}/bulk:
    post:
      tags: [Business]
      summary: Bulk create beneficiaries
      description: |
        Each beneficiary is processed independently — individual failures do
        not roll back the rest of the batch. Response includes a per-row
        result array.
      operationId: bulkCreateBeneficiaries
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        "200":
          description: Bulk result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/beneficiaries/{associationId}/{id}:
    get:
      tags: [Business]
      summary: Get beneficiary
      operationId: getBeneficiary
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Single beneficiary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Business]
      summary: Update beneficiary
      description: |
        Replace-style update — all child collections (details, payment
        destinations, addresses, tags) are deleted and recreated from the
        request body. Send the full intended state.
      operationId: updateBeneficiary
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Beneficiary updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Business]
      summary: Delete beneficiary
      description: |
        Hard delete — cascades to detail rows, payment destinations,
        addresses, and tags.
      operationId: deleteBeneficiary
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Beneficiary deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/business/beneficiaries/{associationId}/{id}/tags:
    get:
      tags: [Business]
      summary: List beneficiary tags
      operationId: getBeneficiaryTags
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current tags plus suggested tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Business]
      summary: Replace beneficiary tags
      description: |
        Replace-style — the tag array in the body overwrites the existing set.
      operationId: updateBeneficiaryTags
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
