                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Tags replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/business/beneficiaries/{associationId}/{id}/payment-destinations:
    get:
      tags: [Business]
      summary: List payment destinations
      operationId: listPaymentDestinations
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
            enum: [BANK, MOMO, CRYPTO, CARD, CASH, QR, VOUCHER, WALLET]
          description: Filter by payment method.
      responses:
        "200":
          description: Payment destinations.
          content:
            application/json:
