  /v1/business/beneficiaries/{associationId}/{id}/payment-destinations/{destId}/primary:
    put:
      tags: [Business]
      summary: Set primary payment destination
      description: |
        Marks the destination as primary for its method; the upstream unsets
        any prior primary for the same method.
      operationId: setPrimaryPaymentDestination
      parameters:
        - name: associationId
          in: path
