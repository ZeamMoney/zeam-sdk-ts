          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: destId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Primary flag updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Transactions ─────────────────────────────────────────────────────

  /v1/transaction/init:
    post:
      tags: [Transactions]
      summary: Initialise a transaction
      description: |
        Creates a new transaction reference via transactions-v2.zeam.dotnet.
        The gateway rejects any caller-supplied body and injects
        `{"origin":"ApiGateway"}` as the upstream payload.
      operationId: initTransaction
      requestBody:
        description: No body allowed — the gateway injects the payload.
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        "201":
          description: Transaction initialised.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      requestId:
                        type: string
                        format: uuid
                        description: Transaction reference.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Caller sent a request body (not permitted).

  /v1/transaction/status/{transactionId}:
    get:
      tags: [Transactions]
      summary: Get transaction status
      description: |
        Returns the current status of a transaction from
        transactions-v2.zeam.dotnet.
      operationId: getTransactionStatus
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
          description: Transaction UUID or reference.
      responses:
        "200":
          description: Transaction status.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transaction/load:
    post:
      tags: [Transactions]
      summary: Load a transaction for execution
      description: |
        Proxies to transactions-acl.zeam.dotnet. Loads transaction data
        scoped by the caller's ACL.
      operationId: loadTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Load request payload (forwarded verbatim to upstream).
      responses:
        "200":
          description: Transaction loaded.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Connect ──────────────────────────────────────────────────────────

  /v1/connect-routes:
    get:
      tags: [Connect]
      summary: List payment routes
      description: Returns available cross-border payment routes.
      operationId: listConnectRoutes
      security:
        - bearerAuth: []
          zeamAuth: []
      responses:
        "200":
          description: Route list.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-providers:
    get:
      tags: [Connect]
      summary: List providers
      description: Returns all payment providers.
      operationId: listConnectProviders
      security:
        - bearerAuth: []
          zeamAuth: []
      responses:
        "200":
          description: Provider list.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-providers/{id}:
    get:
      tags: [Connect]
      summary: Get provider by ID
      operationId: getConnectProvider
      security:
        - bearerAuth: []
          zeamAuth: []
      parameters:
