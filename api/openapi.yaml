      responses:
        "200":
          description: Country list.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-assets:
    get:
      tags: [Connect]
      summary: List Connect assets
      description: Returns assets supported by the Connect platform.
      operationId: listConnectAssets
      security:
        - bearerAuth: []
          zeamAuth: []
      responses:
        "200":
          description: Asset list.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-assets/{id}:
    get:
      tags: [Connect]
      summary: Get Connect asset by ID
      operationId: getConnectAsset
      security:
        - bearerAuth: []
          zeamAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Asset detail.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/connect-quote:
    post:
      tags: [Connect]
      summary: Get a payment quote
      description: |
        Fixed alias that always proxies to the upstream `quote/send` path.
        Use this when you want a direction-free quoting surface.
      operationId: connectQuote
      security:
        - bearerAuth: []
          zeamAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Quote request payload (forwarded verbatim).
      responses:
        "200":
          description: Quote returned.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-quote/{direction}:
    post:
      tags: [Connect]
      summary: Get a directional payment quote
      description: |
        Creates a quote for the specified direction (`send` or `receive`).
        Upstream returns 402 Payment Required on success (documented).
      operationId: connectQuoteDirection
      security:
        - bearerAuth: []
          zeamAuth: []
      parameters:
        - name: direction
          in: path
          required: true
          schema:
            type: string
            enum: [send, receive]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "402":
          description: Quote created (Payment Required — documented upstream convention).
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-execute:
    post:
      tags: [Connect]
      summary: Execute a payment
      description: |
        Unified execute surface. When `TRANSACTIONS_URL` is configured the
        gateway first calls transaction/init to obtain a reference, injects
        it as `reference` in the body, then proxies to Connect `/offramp`.
      operationId: connectExecute
      security:
        - bearerAuth: []
          zeamAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Execution payload. `reference` is injected by the gateway.
      responses:
        "200":
          description: Execution result.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-offramp:
    post:
      tags: [Connect]
      summary: Execute an off-ramp
      description: Proxies to Connect `/offramp`.
      operationId: connectOfframp
      security:
        - bearerAuth: []
          zeamAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Off-ramp result.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-onramp:
    post:
      tags: [Connect]
      summary: Execute an on-ramp
      description: Proxies to Connect `/onramp`.
      operationId: connectOnramp
      security:
        - bearerAuth: []
          zeamAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: On-ramp result.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-onramp/cash-in:
    post:
      tags: [Connect]
      summary: On-ramp cash-in
      description: Proxies to Connect `/onramp/cash-in`.
      operationId: connectOnrampCashIn
      security:
        - bearerAuth: []
          zeamAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Cash-in result.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-status/{transaction_id}:
    get:
      tags: [Connect]
      summary: Get Connect transaction status
      operationId: getConnectStatus
      security:
        - bearerAuth: []
          zeamAuth: []
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction status.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/connect-integrators:
    get:
      tags: [Connect]
      summary: Get integrator info
      description: Returns the integrator record for the authenticated app.
      operationId: getConnectIntegrator
      security:
        - bearerAuth: []
          zeamAuth: []
      responses:
        "200":
          description: Integrator detail.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-platform/health:
    get:
      tags: [Connect]
      summary: Connect platform health
      description: Returns the health status of the Connect platform.
      operationId: getConnectPlatformHealth
      security:
        - bearerAuth: []
          zeamAuth: []
      responses:
        "200":
          description: Platform health.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-query:
    post:
      tags: [Connect]
      summary: Query available connectors
      description: |
        The gateway builds a canonical GraphQL Connectors query against the
        Connect service. Callers supply `countryISO` and `method` filters;
        the gateway owns the query shape. Direction is pinned to `OFF_RAMP`.

        Auth: accepts Firebase bearers (no `x-zeam-auth` required) or
        SEP-10 bearers (`x-zeam-auth` required).
      operationId: connectQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectQueryRequest"
      responses:
        "200":
          description: Connector results (GraphQL envelope).
          content:
            application/json:
              schema:
                type: object
                description: "`{data, errors}` GraphQL envelope forwarded verbatim."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connect-exec/{path}:
    post:
      tags: [Connect]
      summary: Metadata-driven execution
      description: |
        Forwards the request to Connect's REST API under the specified path.
        The path is taken from the GraphQL `execution[].path` field returned
        by `/v1/connect-query`. Supports POST, GET, PUT, PATCH, DELETE.
        Absolute URLs are rejected (SSRF guard).
      operationId: connectExec
      security:
        - bearerAuth: []
          zeamAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Relative path from GraphQL execution metadata.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Upstream response (forwarded verbatim).
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Stellar Horizon ──────────────────────────────────────────────────

  /v1/stellar/account/{id}:
    get:
      tags: [Stellar]
      summary: Get Stellar account
      description: |
        Proxies to Horizon `GET /accounts/:id`. Returns the full account
        record (balances, signers, thresholds, data entries, flags).
      operationId: getStellarAccount
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Horizon account record.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stellar/account/{id}/transactions:
    get:
      tags: [Stellar]
      summary: List account transactions
      description: |
        Proxies to Horizon `GET /accounts/:id/transactions`. Query params
        are forwarded verbatim for Horizon pagination.
      operationId: getStellarAccountTransactions
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
          description: Page size.
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: cursor
          in: query
          schema:
            type: string
          description: Paging token for keyset pagination.
        - name: include_failed
          in: query
          schema:
            type: boolean
            default: false
          description: Include failed transactions.
      responses:
        "200":
          description: Transaction list (Horizon envelope).
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stellar/transaction/{id}:
    get:
      tags: [Stellar]
      summary: Get Stellar transaction
      description: |
        Proxies to Horizon `GET /transactions/:id`. The `id` may be the
        transaction hash (hex) or the paging token.
      operationId: getStellarTransaction
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Horizon transaction record.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stellar/transaction/{id}/effects:
    get:
      tags: [Stellar]
      summary: List transaction effects
      description: |
        Proxies to Horizon `GET /transactions/:id/effects`.
      operationId: getStellarTransactionEffects
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
          description: Page size.
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: cursor
          in: query
          schema:
            type: string
          description: Paging token.
      responses:
        "200":
          description: Effect list (Horizon envelope).
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Connector discovery ────────────────────────────────────────────────

  /v1/business/beneficiaries/getAvailableConnectors/{associationId}/{beneficiaryId}/{method}:
    get:
      tags: [Business]
      summary: Available connectors for a beneficiary
      description: |
        Orchestrates beneficiary lookup (Business API) + connector discovery
        (Connect GraphQL) to find Connect routes usable for the specified
        beneficiary's payment destination.
      operationId: getAvailableConnectors
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: beneficiaryId
          in: path
          required: true
          schema:
            type: string
        - name: method
          in: path
          required: true
          schema:
            type: string
            enum: [BANK, MOMO, CRYPTO, CARD, CASH, QR, VOUCHER, WALLET]
      responses:
        "200":
          description: Available connectors.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Applications ───────────────────────────────────────────

  /v1/applications/{association_id}:
    get:
      tags: [Applications]
      summary: List applications for an association
      description: |
        Returns all applications belonging to the specified association.
        Optionally filter by `status` query parameter.
      operationId: listApplications
      parameters:
        - name: association_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, pending_approval, approved, suspended, revoked, rejected]
      responses:
        "200":
          description: Application list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplicationList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/application:
    post:
      tags: [Applications]
      summary: Register a new application
      description: |
        Persists a new application, generates a Stellar keypair, signs up with
        the auth service, registers with the Connect gateway, and returns the
        one-time-visible credentials. Store the `apiKey.secret` and
        `stellar.secret` immediately — they cannot be retrieved again.
      operationId: registerApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationRegisterInput"
      responses:
        "201":
          description: Application registered. Contains one-time-visible credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/application/provision:
    post:
      tags: [Applications]
      summary: Provision a draft application
      description: |
        Creates a named draft application record without generating a Stellar
        keypair, signing up with the auth service, or registering with Connect.
        The draft has no credentials and no Stellar identity. Call
        `POST /v1/application/{id}/activate` when ready to issue credentials
        and complete the registration pipeline.
      operationId: provisionApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationProvisionInput"
      responses:
        "201":
          description: Draft application created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/application/lookup:
    get:
      tags: [Applications]
      summary: Lookup application by public key
      description: |
        Read-only lookup by Stellar public key. Used by downstream middleware
        to resolve application identity.
      operationId: lookupApplication
      parameters:
        - name: publicKey
          in: query
          required: true
          schema:
            type: string
            pattern: "^G[A-Z0-9]{55}$"
      responses:
        "200":
          description: Application found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}:
    get:
      tags: [Applications]
      summary: Get application by ID
      operationId: getApplication
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Application detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/event:
    get:
      tags: [Applications]
      summary: List application events
      description: |
        Returns the audit trail for an application — lifecycle transitions,
        credential rotations, webhook changes, and authentication outcomes.
      operationId: listApplicationEvents
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Event history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/activate:
    post:
      tags: [Applications]
      summary: Activate a draft application
      description: |
        Generates a Stellar keypair, signs up with the auth service, drives
        SEP-10 `/auth-connect` against the anchor, registers with the Connect
        gateway, and issues credentials. The application must be in `draft`
        status with no existing Stellar identity.

        Store `stellar.secret` and `apiKey.secret` immediately — they cannot
        be retrieved again after this call.
      operationId: activateApplication
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateApplicationInput"
      responses:
        "201":
          description: Application activated. Contains one-time-visible credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/application/{id}/submit:
    post:
      tags: [Applications]
      summary: Submit application for review
      description: |
        Transitions a draft application to `pending_approval`. The application
        must be in `draft` status.
      operationId: submitApplication
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Application submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/application/{id}/approve:
    post:
      tags: [Applications]
      summary: Approve application
      description: |
        Approves a `pending_approval` application. The approver must differ
        from the submitter (two-person rule).
      operationId: approveApplication
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Application approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Self-approval denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/application/{id}/reject:
    post:
      tags: [Applications]
      summary: Reject application
      operationId: rejectApplication
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionInput"
      responses:
        "200":
          description: Application rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/suspend:
    post:
      tags: [Applications]
      summary: Suspend application
      operationId: suspendApplication
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionInput"
      responses:
        "200":
          description: Application suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/resume:
    post:
      tags: [Applications]
      summary: Resume application
      operationId: resumeApplication
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Application resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/revoke:
    post:
      tags: [Applications]
      summary: Revoke application
      description: |
        Terminally revokes an application. This cannot be undone.
      operationId: revokeApplication
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionInput"
      responses:
        "200":
          description: Application revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/rotate-credential:
    post:
      tags: [Applications]
      summary: Rotate application credential
      description: |
        Issues a new API credential and marks the previous one as rotating.
        The returned `secret` is one-time-visible — store it immediately.
      operationId: rotateApplicationCredential
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "201":
          description: New credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAPIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/token:
    post:
      tags: [Applications]
      summary: Token smoke test
      description: |
        Drives the SEP-10 `/auth-connect` flow on the upstream service and
        verifies the `x-connect-integrator` claim. Use this to confirm your
        application's credentials are working end-to-end.
      operationId: tokenSmokeTest
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Token verified.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/webhook:
    get:
      tags: [Applications]
      summary: List webhooks
      operationId: listWebhooks
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Webhook list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWebhookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Applications]
      summary: Add webhook
      description: |
        Registers a new webhook endpoint for the application. A signing secret
        is generated server-side and returned once — store it immediately.
      operationId: addWebhook
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWebhookInput"
      responses:
        "201":
          description: Webhook created with one-time-visible signing secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWebhookCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/application/{id}/webhook/{webhookId}:
    patch:
      tags: [Applications]
      summary: Update webhook
      description: |
        Partially updates a webhook's URL, method, description, or status.
      operationId: updateWebhook
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookInput"
      responses:
        "200":
          description: Webhook updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWebhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Applications]
      summary: Delete webhook
      description: |
        Soft-deletes a webhook. It will no longer receive events.
      operationId: deleteWebhook
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Webhook deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/application/{id}/webhook/{webhookId}/rotate-secret:
    post:
      tags: [Applications]
      summary: Rotate webhook secret
      description: |
        Generates a new signing secret for a webhook. The previous secret
        remains valid during a brief rotation window. The returned `secret`
        is one-time-visible.
      operationId: rotateWebhookSecret
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: New secret generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWebhookSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Gateway-issued bearer. Source the token from one of:

        - `POST /v1/public/auth/verify-otp` (OTP user principal)
        - `POST /v1/public/auth-connect` (SEP-10 app principal)
        - Firebase Auth (end-user mobile/web)
        - Azure Entra ID (admin/corporate)

        Include as `Authorization: Bearer <token>`.
    zeamAuth:
      type: apiKey
      in: header
      name: x-zeam-auth
      description: |
        App API key for the Connect route group. Combined with SEP-10 bearer
        (both are required for `/v1/connect-*`).
  headers:
    XRequestId:
      description: Opaque request correlation ID propagated on every response.
      schema:
        type: string
        example: req_01HWX9YZ7T5K8QF3NSDE9B2M0P
  responses:
    BadRequest:
      description: Request body or query parameters failed validation.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    Unauthorized:
      description: Missing, expired, or invalid credential.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    Conflict:
      description: Conflicting state (e.g. OTP code already consumed).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    BadGateway:
      description: |
        An upstream service (auth, anchor, Connect gateway) returned an
        error or was unreachable. Retry with backoff.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource UUID.
  schemas:
    EnvelopeHealth:
      type: object
      required: [ok, request_id, resource, verb, data]
      properties:
        ok:
          type: boolean
        request_id:
          type: string
        resource:
          type: string
          example: health
        verb:
          type: string
          example: get
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            uptime_ms:
              type: integer
              format: int64
            version:
              type: string
            db:
              type: string
              enum: [ok, error]
    EnvelopeError:
      type: object
      description: |
        Standard error envelope. Mirrors the success envelope shape but
        `data` is always `null` and `message` encodes "code: description".
      required: [data, status, message]
      properties:
        data:
          example: null
          description: Always null for error responses.
        status:
          type: integer
          description: Mirrors the HTTP status code.
          examples: [400, 401, 404, 409, 422, 500]
        message:
          type: string
          description: "Format: 'code: description'."
          examples:
            - "invalid_input: field required"
            - "unauthorized: missing bearer token"
            - "not_found: resource not found"
    BusinessResponse:
      type: object
      description: |
        Standard Business API response envelope. The `data` field carries the
        domain-specific payload (array or object depending on the endpoint).
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Domain-specific payload (proxied verbatim from upstream).
    AssociationViewModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        associationName:
          type: string
        typeName:
          type: string
        identityName:
          type: string
        publicKey:
          type: string
        typeId:
          type: string
        signerId:
          type: string
        creatorIdentityId:
          type: string
        status:
          type: string
        merchant:
          type: boolean
    AssetResult:
      type: object
      description: Asset enriched with bridge/network data.
      properties:
        id:
          type: string
          format: uuid
        symbol:
          type: string
          example: USDC
        name:
          type: string
        type:
          type: string
          example: token
        decimals:
          type: integer
        contractAddress:
          type: string
        issuerAddress:
          type: string
    AssetDTO:
      type: object
      description: Minimal asset record.
      properties:
        assetID:
          type: string
        symbol:
          type: string
        name:
          type: string
        contractAddress:
          type: string
        issuerAddress:
          type: string
    WalletType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        productId:
          type: string
          format: uuid
        description:
          type: string
        custodyType:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WalletModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        walletName:
          type: string
        binId:
          type: string
          format: uuid
        typeId:
          type: string
          format: uuid
        networkId:
          type: string
          format: uuid
        publicKey:
          type: string
        accountNumber:
          type: string
        sequenceNumber:
          type: integer
        custodial:
          type: boolean
        hasMultipleSigners:
          type: boolean
        vaultId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WalletDTO:
      type: object
      description: Minimal wallet record with association context.
      properties:
        id:
          type: string
          format: uuid
        walletName:
          type: string
        custodial:
          type: boolean
        networkId:
          type: string
          format: uuid
        publicKey:
          type: string
        typeId:
          type: string
          format: uuid
        accountNumber:
          type: string
        associationId:
          type: string
          format: uuid
        associationName:
          type: string
    BeneficiaryModel:
      type: object
      description: Full beneficiary record with type-specific details.
      properties:
        id:
          type: string
          format: uuid
        association_id:
          type: string
          format: uuid
        beneficiary_type:
          type: string
          enum: [Individual, Business]
        reference:
          type: string
        individual:
          $ref: "#/components/schemas/BeneficiaryIndividual"
        business:
          $ref: "#/components/schemas/BeneficiaryBusiness"
        payment_destinations:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDestination"
        addresses:
          type: array
          items:
            type: object
        tags:
          type: array
          items:
            type: object
            properties:
              tag:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BeneficiaryIndividual:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        id_number:
          type: string
        date_of_birth:
          type: string
          format: date
        nationality:
          type: string
          description: ISO 3166-1 alpha-2.
        mobile_number:
          type: string
        email:
          type: string
    BeneficiaryBusiness:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_name:
          type: string
        registration_number:
          type: string
        country_of_registration:
          type: string
        tax_id:
          type: string
        industry:
          type: string
        contact_person_name:
          type: string
        contact_number:
          type: string
        contact_email:
          type: string
    PaymentDestination:
      type: object
      description: |
        A payment endpoint for a beneficiary. Fields populated depend on
        the `method` (BANK, MOMO, CRYPTO, etc.).
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum: [BANK, MOMO, CRYPTO, CARD, CASH, QR, VOUCHER, WALLET]
        label:
          type: string
        is_primary:
          type: boolean
        country_iso:
          type: string
        currency_code:
          type: string
        bank_name:
          type: string
        account_number:
          type: string
        account_name:
          type: string
        sort_code:
          type: string
        iban:
          type: string
        swift_bic:
          type: string
        mobile_number:
          type: string
        mobile_provider:
          type: string
        network_name:
          type: string
        asset_symbol:
          type: string
        wallet_address:
          type: string
    BeneficiaryRequest:
      type: object
      required: [beneficiary_type]
      description: |
        Create or update a beneficiary. Include `individual` details for
        type `Individual`, or `business` details for type `Business`.
      properties:
        beneficiary_type:
          type: string
          enum: [Individual, Business]
        reference:
          type: string
        individual:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            id_number:
              type: string
            date_of_birth:
              type: string
              format: date
            nationality:
              type: string
            mobile_number:
              type: string
            email:
              type: string
        business:
          type: object
          properties:
            company_name:
              type: string
            registration_number:
              type: string
            country_of_registration:
              type: string
            tax_id:
              type: string
            industry:
              type: string
            contact_person_name:
              type: string
            contact_number:
              type: string
            contact_email:
              type: string
        payment_destinations:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDestinationRequest"
        tags:
          type: array
          items:
            type: string
    PaymentDestinationRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [BANK, MOMO, CRYPTO, CARD, CASH, QR, VOUCHER, WALLET]
        label:
          type: string
        is_primary:
          type: boolean
        country_iso:
          type: string
        currency_code:
          type: string
        bank_name:
          type: string
        bank_code:
          type: string
        account_number:
          type: string
        account_name:
          type: string
        sort_code:
          type: string
        iban:
          type: string
        swift_bic:
          type: string
        mobile_number:
          type: string
        mobile_provider:
          type: string
        wallet_address:
          type: string
    BulkCreateResult:
      type: object
      properties:
        index:
          type: integer
        success:
          type: boolean
        beneficiary_id:
          type: string
          format: uuid
        error:
          type: string
    TagsResponseData:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        suggested_tags:
          type: array
          items:
            type: string
    RequestOtpInput:
      type: object
      required: [mobileNumber]
      properties:
        mobileNumber:
          type: string
          description: E.164 mobile number that will receive the OTP.
          example: "+27821234567"
    RequestOtpResult:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
          description: Opaque handle to replay on verification.
    VerifyOtpInput:
      type: object
      required: [requestId, code]
      properties:
        requestId:
          type: string
          format: uuid
          description: Request ID from the request-otp response.
        code:
          type: string
          description: One-time code received via WhatsApp/SMS.
          example: "1234"
    TokenPair:
      type: object
      required: [idToken, refreshToken, expiresIn]
      properties:
        idToken:
          type: string
          description: Gateway bearer for `/v1/*` routes.
        refreshToken:
          type: string
          description: Long-lived refresh token.
        expiresIn:
          type: string
          description: TTL in seconds as a string (e.g. "3600").
          example: "3600"
        customToken:
          type: string
          description: Optional Firebase custom token.
    Association:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, suspended, pending]
    StellarTxRequest:
      type: object
      required: [toPublicKey, fromAsset, amount]
      properties:
        toPublicKey:
          type: string
          pattern: "^G[A-Z0-9]{55}$"
          description: Destination Stellar account.
        fromAsset:
          type: string
          description: "`XLM`, `native`, or `CODE:ISSUER`."
          example: "USDC:GA5ZSE..."
        toAsset:
          type: string
          description: "Optional destination asset. When omitted or equal to `fromAsset`, a plain Payment is used; otherwise Strict Path Receive."
        amount:
          type: string
          description: Decimal amount (up to 7 fractional digits, must be > 0).
          example: "12.3456789"
        sendMax:
          type: string
          description: Maximum source amount for path payments. Populate from a prior `/v1/stellar/quote`.
        memo:
          type: string
          maxLength: 28
          description: Optional Stellar memo (≤ 28 bytes for Text type).
        memoType:
          type: string
          enum: [Text, Hash, ID]
          description: "Memo type. Default: Text."
    StellarQuoteRequest:
      type: object
      required: [fromAsset, toAsset, amount]
      properties:
        fromAsset:
          type: string
          description: Source asset (`XLM`, `native`, or `CODE:ISSUER`).
        toAsset:
          type: string
          description: Destination asset (must differ from `fromAsset`).
        amount:
          type: string
          description: Decimal amount (up to 7 fractional digits, must be > 0).
    ConnectQueryRequest:
      type: object
      required: [countryISO, method]
      properties:
        countryISO:
          type: string
          description: |
            ISO 3166-1 alpha-2 country code. Uppercase ASCII letters only.
          example: ZW
        method:
          type: string
          description: |
            Payment method filter. Uppercase ASCII letters, digits, and
            underscores.
          example: MOBILE_MONEY
    ApplicationProvisionInput:
      type: object
      required: [associationId, applicationName]
      description: |
        Minimal payload to create a named draft. No credentials are issued at
        this stage — call `POST /v1/application/{id}/activate` to complete
        the registration pipeline.
      properties:
        associationId:
          type: string
          format: uuid
          description: Association this application belongs to.
        applicationName:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name for the application.
        expiresAt:
          type: string
          format: date-time
          description: Optional credential expiry. Omit for no expiry.
    ActivateApplicationInput:
      type: object
      description: |
        All fields are optional. Provide a `webhookUrl` to register a webhook
        during activation. `settlementAccount` overrides the platform default.
      properties:
        webhookUrl:
          type: string
          format: uri
          description: Optional webhook endpoint to register on activation.
        webhookMethod:
          type: string
          enum: [POST, PUT]
          default: POST
          description: HTTP method for webhook delivery.
        settlementAccount:
          $ref: "#/components/schemas/SettlementAccountInput"
    SettlementAccountInput:
      type: object
      description: Settlement account override for Connect integration.
      required: [publicKey, vaultId]
      properties:
        publicKey:
          type: string
          pattern: "^G[A-Z0-9]{55}$"
          description: Stellar public key of the settlement account.
        vaultId:
          type: string
          format: uuid
          description: Azure Key Vault secret ID for the settlement account seed.
    ApplicationRegisterInput:
      type: object
      required: [associationId, applicationName]
      properties:
        associationId:
          type: string
          format: uuid
          description: Association this application belongs to.
        applicationName:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name for the application.
        webhookUrl:
          type: string
          format: uri
          description: Optional webhook endpoint to register on creation.
        webhookMethod:
          type: string
          enum: [POST, PUT]
          description: HTTP method for webhook delivery.
        settlementAccount:
          $ref: "#/components/schemas/SettlementAccountInput"
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry. Omit for no expiry.
    ApplicationViewModel:
      type: object
      description: Read-side representation of an application.
      properties:
        id:
          type: string
          format: uuid
        associationId:
          type: string
          format: uuid
        applicationName:
          type: string
        classificationCode:
          type: string
          example: PARTNER_PSP
        publicKey:
          type: string
          description: Stellar public key (G...). Null for unactivated drafts.
        environment:
          type: string
          enum: [sandbox, production]
        status:
          type: string
          enum: [draft, pending_approval, approved, suspended, revoked, rejected, expired]
        activated:
          type: boolean
          description: Whether the application has a Stellar identity.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegisterApplicationResponse:
      type: object
      description: |
        Returned on successful registration. Contains one-time-visible
        credentials that cannot be retrieved again.
      properties:
        application:
          $ref: "#/components/schemas/ApplicationViewModel"
        integratorId:
          type: string
        stellar:
          $ref: "#/components/schemas/StellarKeyMaterial"
        apiKey:
          $ref: "#/components/schemas/APIKeyMaterial"
        webhookSecret:
          $ref: "#/components/schemas/WebhookSecretMaterial"
        connectSecret:
          type: string
          writeOnly: true
        warnings:
          type: array
          items:
            type: string
    StellarKeyMaterial:
      type: object
      description: One-time-visible Stellar keypair. Returned only at registration/activation time.
      properties:
        publicKey:
          type: string
          pattern: "^G[A-Z0-9]{55}$"
          description: Stellar public key (G...).
        secret:
          type: string
          writeOnly: true
          description: Stellar seed (S...). Store securely — never returned again.
        vaultId:
          type: string
          format: uuid
          description: Azure Key Vault secret ID under which the seed is stored.
    APIKeyMaterial:
      type: object
      description: One-time-visible API key credential.
      properties:
        keyId:
          type: string
          description: Stable key identifier (safe to store/log).
        secret:
          type: string
          writeOnly: true
          description: Raw secret — store securely, never returned again.
        last4:
          type: string
          description: Last 4 characters of the secret for identification.
    WebhookSecretMaterial:
      type: object
      description: One-time-visible webhook signing secret.
      properties:
        webhookId:
          type: string
          format: uuid
        secret:
          type: string
          writeOnly: true
          description: Raw signing secret — store securely.
        last4:
          type: string
    ApplicationWebhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        webhookMethod:
          type: string
          enum: [POST, PUT]
        description:
          type: string
        authScheme:
          type: string
          enum: [none, bearer, hmac]
        status:
          type: string
          enum: [pending_verification, active, paused, disabled, revoked]
        failureCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccessEvent:
      type: object
      description: Audit trail entry.
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        eventType:
          type: string
          example: approved
        outcome:
          type: string
          enum: [success, denied, error]
        reason:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
    TransitionInput:
      type: object
      description: Optional reason for lifecycle transitions (reject, suspend, revoke).
      properties:
        reason:
          type: string
    AddWebhookInput:
      type: object
      required: [url, webhookMethod, authScheme]
      properties:
        url:
          type: string
          format: uri
          description: The endpoint URL that will receive events.
        webhookMethod:
          type: string
          enum: [POST, PUT]
        description:
          type: string
        authScheme:
          type: string
          enum: [none, bearer, hmac]
          description: Signing scheme. `hmac` is recommended.
    UpdateWebhookInput:
      type: object
      description: Partial update — include only fields to change.
      properties:
        url:
          type: string
          format: uri
        webhookMethod:
          type: string
          enum: [POST, PUT]
        description:
          type: string
        status:
          type: string
          enum: [pending_verification, active, paused, disabled, revoked]
    EnvelopeApplication:
      type: object
      description: Standard envelope wrapping a single application.
      properties:
        data:
          $ref: "#/components/schemas/ApplicationViewModel"
        status:
          type: integer
          example: 200
        message:
          type: string
    EnvelopeApplicationList:
      type: object
      description: Standard envelope wrapping an application array.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationViewModel"
        status:
          type: integer
          example: 200
        message:
          type: string
    EnvelopeRegisterResponse:
      type: object
      description: Standard envelope wrapping the registration result.
      properties:
        data:
          $ref: "#/components/schemas/RegisterApplicationResponse"
        status:
          type: integer
          example: 201
        message:
          type: string
    EnvelopeEventList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AccessEvent"
        status:
          type: integer
        message:
          type: string
    EnvelopeWebhookList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationWebhook"
        status:
          type: integer
        message:
          type: string
    EnvelopeWebhook:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ApplicationWebhook"
        status:
          type: integer
        message:
          type: string
    EnvelopeWebhookCreated:
      type: object
      description: Webhook with one-time-visible signing secret.
      properties:
        data:
          type: object
          properties:
            webhook:
              $ref: "#/components/schemas/ApplicationWebhook"
            secret:
              $ref: "#/components/schemas/WebhookSecretMaterial"
        status:
          type: integer
        message:
          type: string
    EnvelopeWebhookSecret:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/WebhookSecretMaterial"
        status:
          type: integer
        message:
          type: string
    EnvelopeAPIKey:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/APIKeyMaterial"
        status:
          type: integer
        message:
          type: string
          format: date-time
