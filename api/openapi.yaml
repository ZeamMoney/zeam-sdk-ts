        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Business]
      summary: Add payment destination
      description: |
        The upstream auto-promotes the first destination of a given method to
        primary when no existing destination carries that method.
      operationId: addPaymentDestination
      parameters:
        - name: associationId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payment destination payload (forwarded verbatim).
      responses:
        "200":
          description: Destination added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/business/beneficiaries/{associationId}/{id}/payment-destinations/{destId}:
    put:
